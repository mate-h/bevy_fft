[package]
name = "bevy_fft"
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
description = "GPU FFT library for Bevy: frequency-domain filtering and synthesis on square power-of-two grids."
license = "MIT"
repository = "https://github.com/mate-h/bevy_fft"
readme = "README.md"
keywords = ["bevy", "fft", "gpu", "wgpu", "ocean"]
categories = ["game-development", "graphics", "rendering::data-formats"]

[workspace]
members = ["crates/river_geometry"]

[dependencies]
bevy = "0.20.0"
bytemuck = "1.24"
image = { version = "0.25", default-features = false }

[[example]]
name = "fft"
path = "examples/fft/main.rs"

[[example]]
name = "ocean"
path = "examples/ocean/main.rs"
required-features = ["free_camera"]

[[example]]
name = "shallow_water"
path = "examples/shallow_water/main.rs"
required-features = ["free_camera"]

[[example]]
name = "beach"
path = "examples/beach/main.rs"
required-features = ["free_camera"]

[[example]]
name = "pool"
path = "examples/pool/main.rs"
required-features = ["free_camera"]

[[example]]
name = "carve_rivers"
path = "examples/carve_rivers/main.rs"

[[example]]
name = "route_river"
path = "examples/route_river/main.rs"

[[example]]
name = "river_banks"
path = "examples/river_banks/main.rs"

[[example]]
name = "floating"
path = "examples/floating/main.rs"
required-features = ["free_camera"]

[[example]]
name = "wake"
path = "examples/wake/main.rs"
required-features = ["free_camera"]

[[example]]
name = "boat"
path = "examples/boat/main.rs"
required-features = ["free_camera"]

[[example]]
name = "ewave"
path = "examples/ewave/main.rs"
required-features = ["free_camera"]

[[example]]
name = "dispersive"
path = "examples/dispersive/main.rs"
required-features = ["free_camera"]

[dev-dependencies]
river_geometry = { path = "crates/river_geometry", version = "0.1" }
bevy = { version = "0.20.0", features = ["dds"] }
bevy_egui = "0.43.1"
bevy_rapier3d = { version = "0.37", default-features = false, features = ["dim3", "debug-render-3d"] }
bevy_terrain = { git = "https://github.com/mate-h/bevy_terrain", branch = "bevy-0.20.0", default-features = false }
serde_json = "1"
tiff = "0.10"

[features]
file_watcher = ["bevy/file_watcher"]
free_camera = ["bevy/free_camera"]
