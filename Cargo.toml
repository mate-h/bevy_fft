[package]
name = "bevy_fft"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "GPU FFT library for Bevy: frequency-domain filtering and synthesis on square power-of-two grids."
license = "MIT"
repository = "https://github.com/mate-h/bevy_fft"
readme = "README.md"
keywords = ["bevy", "fft", "gpu", "wgpu", "ocean"]
categories = ["game-development", "graphics", "rendering::data-formats"]

[dependencies]
bevy = "0.20.0"
bytemuck = "1.24"
image = { version = "0.25", default-features = false }

[[example]]
name = "fft"
path = "examples/fft/main.rs"

[[example]]
name = "ocean"
path = "examples/ocean/main.rs"
required-features = ["free_camera"]

[[example]]
name = "shallow_water"
path = "examples/shallow_water/main.rs"
required-features = ["free_camera"]

[[example]]
name = "ewave"
path = "examples/ewave/main.rs"
required-features = ["free_camera"]

[[example]]
name = "dispersive"
path = "examples/dispersive/main.rs"
required-features = ["free_camera"]

[dev-dependencies]
# No crates.io release targets Bevy 0.20 yet (support table tops out at 0.19 / 0.40–0.42).
# WIP PR: https://github.com/vladbat00/bevy_egui/pull/500
bevy_egui = { git = "https://github.com/vladbat00/bevy_egui.git", rev = "cbefd381c5910ae0fb56022ab1637f22587c7e05" }

[features]
file_watcher = ["bevy/file_watcher"]
free_camera = ["bevy/free_camera"]
